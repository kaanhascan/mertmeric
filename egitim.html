<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MERTMERIC</title>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://gjbvypvyikrwicdfhler.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css?v=15">
</head>

<body class="bio-page-body">
    <video id="bioBgv" autoplay muted loop playsinline style="display:none"></video>
    <img id="bggif" alt="" style="display:none">
    <div id="deskOverlay"></div>

    <div id="bar">
        <b id="bn">MERTMERIC</b>
        <span>Finder</span>
        <span class="hide-sm">File</span>
        <span class="hide-sm">Edit</span>
        <span class="hide-sm">View</span>
        <span class="hide-sm">Window</span>
        <span class="sp"></span>
        <div class="bar-right">
            <svg viewBox="0 0 24 18" aria-hidden="true">
                <path
                    d="M12 15.5l2.6-2.6a3.7 3.7 0 00-5.2 0zM6.3 9.8a8 8 0 0111.4 0l1.4-1.4a10 10 0 00-14.2 0zM2.5 6A13.4 13.4 0 0121.5 6l1.4-1.4a15.4 15.4 0 00-21.8 0z" />
            </svg>
            <svg viewBox="0 0 28 14" aria-hidden="true">
                <rect x=".5" y=".5" width="22" height="13" rx="3.5" fill="none" stroke="#fff" />
                <rect x="2" y="2" width="18" height="10" rx="2" />
                <rect x="24" y="4.5" width="2.5" height="5" rx="1" />
            </svg>
            <span id="bt"></span>
        </div>
    </div>

    <main class="bio-page-wrap">
        <article class="hub-card bio-page-card">
            <div class="bio-page-top">
                <a href="index.html#hub" class="bio-back-btn" id="eduBackBtn">‹ Geri Dön</a>
                <div style="display:flex;align-items:center;gap:12px">
                    <span class="bio-badge" id="eduBadge">DJ ACADEMY</span>
                    <div class="bio-lang-switch" id="eduPageLangSwitch" aria-label="Language Switcher">
                        <button type="button" class="lang-flag-btn" data-lang="tr" title="Türkçe">
                            <svg viewBox="0 0 36 24" aria-hidden="true">
                                <rect width="36" height="24" rx="3" fill="#E30A17" />
                                <circle cx="15" cy="12" r="6" fill="#fff" />
                                <circle cx="16.5" cy="12" r="4.8" fill="#E30A17" />
                                <polygon points="20.2,12 24.5,13.4 21.8,9.8 21.8,14.2 24.5,10.6" fill="#fff" />
                            </svg>
                            <span>TR</span>
                        </button>
                        <button type="button" class="lang-flag-btn" data-lang="en" title="English">
                            <svg viewBox="0 0 36 24" aria-hidden="true">
                                <rect width="36" height="24" rx="3" fill="#012169" />
                                <path d="M0,0 L36,24 M36,0 L0,24" stroke="#fff" stroke-width="4.5" />
                                <path d="M0,0 L36,24 M36,0 L0,24" stroke="#C8102E" stroke-width="2.4" />
                                <path d="M18,0 V24 M0,12 H36" stroke="#fff" stroke-width="7" />
                                <path d="M18,0 V24 M0,12 H36" stroke="#C8102E" stroke-width="4" />
                            </svg>
                            <span>EN</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="bio-page-logo" id="bioPageLogo"
                style="flex-direction:column;align-items:center;text-align:center;gap:10px">
                <img id="bioLogoImg" alt="MERTMERIC" style="display:none">
                <h1 id="bioLogoText" style="display:none">MERTMERIC</h1>
                <h2 id="eduPageTitle"
                    style="font-size:20px;font-weight:800;color:#fff;margin:4px 0 0;letter-spacing:-0.01em"></h2>
            </div>

            <div id="eduMainArea">
                <p class="edu-form-intro" id="eduPageDesc"></p>
                <form id="eduApplyForm" class="edu-form"></form>
                <div id="eduFormErr"
                    style="display:none;color:#ff453a;font-size:13px;text-align:center;margin-bottom:14px"></div>
            </div>

            <div class="bio-page-footer">
                <div>
                    <small id="bioFooterLbl">Bookings & Management</small>
                    <a id="bioFooterMail" href="#"></a>
                </div>
                <div class="bio-page-links">
                    <a id="bioLinkIg" href="#" target="_blank" rel="noopener">Instagram ↗</a>
                    <a id="bioLinkSc" href="#" target="_blank" rel="noopener">SoundCloud ↗</a>
                    <a id="bioLinkSp" href="#" target="_blank" rel="noopener">Spotify ↗</a>
                    <a id="bioLinkYt" href="#" target="_blank" rel="noopener">YouTube ↗</a>
                </div>
            </div>
        </article>
    </main>

    <script>
        function updateViewportScale() {
            if (window.innerWidth <= 768) {
                document.documentElement.style.setProperty('--ui-scale', '1');
                return;
            }
            const scale = Math.max(0.7, Math.min(1, window.innerWidth / 1200));
            document.documentElement.style.setProperty('--ui-scale', scale.toFixed(4));
        }
        updateViewportScale();
        window.addEventListener('resize', updateViewportScale);

        function tickClock() {
            const bt = document.getElementById('bt');
            if (!bt) return;
            const d = new Date();
            const L = 'en-US';
            const t = d.toLocaleTimeString(L, { hour: 'numeric', minute: '2-digit', hour12: true });
            bt.textContent = d.toLocaleDateString(L, { weekday: 'short', month: 'short', day: 'numeric' }) + "  " + t;
        }
        tickClock();
        setInterval(tickClock, 10000);

        const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        const SB_URL = "https://gjbvypvyikrwicdfhler.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqYnZ5cHZ5aWtyd2ljZGZobGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjI1MDksImV4cCI6MjEwODU5ODUwOX0.vVEDvyPbZauodNMPG8c_14yJiNqyIBTPmViKiYQJgsM";

        const EDU_STATE = {
            lang: localStorage.getItem('site_lang') === 'en' ? 'en' : 'tr',
            backTr: "‹ Geri Dön",
            backEn: "‹ Back",
            submitted: false,
            draftAnswers: {},
            config: {
                enabled: true,
                badge_tr: "DJ ACADEMY",
                badge_en: "DJ ACADEMY",
                title_tr: "DJ & Prodüksiyon Eğitimi Başvuru Formu",
                title_en: "DJ & Production Academy Application",
                desc_tr: "Birebir DJ ve prodüksiyon eğitimleri için aşağıdaki formu doldurarak başvurunuzu iletebilirsiniz. Başvurunuz incelendikten sonra sizinle iletişime geçilecektir.",
                desc_en: "Fill out the form below to apply for 1-on-1 DJ and music production coaching. We will get back to you after reviewing your application.",
                submit_tr: "Başvuruyu Gönder ↗",
                submit_en: "Submit Application ↗",
                questions: [
                    { id: "q_name", label_tr: "Adınız Soyadınız", label_en: "Full Name", placeholder_tr: "Adınız ve soyadınız", placeholder_en: "Your full name", type: "text", options_tr: "", options_en: "", required: true },
                    { id: "q_contact", label_tr: "Telefon Numaranız (WhatsApp)", label_en: "Phone Number (WhatsApp)", placeholder_tr: "05XX XXX XX XX", placeholder_en: "+90 5XX XXX XX XX", type: "tel", options_tr: "", options_en: "", required: true },
                    { id: "q_ig", label_tr: "Instagram Kullanıcı Adınız", label_en: "Instagram Username", placeholder_tr: "@kullaniciadi", placeholder_en: "@username", type: "text", options_tr: "", options_en: "", required: true },
                    { id: "q_level", label_tr: "Mevcut Seviyeniz / İlgilendiğiniz Alan", label_en: "Current Experience Level / Track", placeholder_tr: "", placeholder_en: "", type: "select", options_tr: "Sıfırdan Başlangıç, Orta Seviye DJ, İleri Seviye / Prodüksiyon", options_en: "Beginner (From Scratch), Intermediate DJ, Advanced / Production", required: true },
                    { id: "q_note", label_tr: "Hedefleriniz & Eklemek İstedikleriniz", label_en: "Your Goals & Additional Notes", placeholder_tr: "Eğitimden beklentilerinizi, müzik tarzınızı veya sormak istediklerinizi yazabilirsiniz...", placeholder_en: "Tell us about your musical goals, favorite genres, or any questions...", type: "textarea", options_tr: "", options_en: "", required: false }
                ]
            }
        };

        function getProxiedMediaUrl(url) {
            if (!url || typeof url !== 'string') return url;
            const prefix = SB_URL + "/storage/v1/object/public/media/";
            const isLocal = typeof window !== 'undefined' && window.location && (
                window.location.protocol === 'file:' ||
                window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1'
            );
            const dp = "https://mertmeric.music/storage/";
            let path = url.startsWith(prefix)
                ? '/storage/' + url.slice(prefix.length)
                : (url.startsWith(dp) ? '/storage/' + url.slice(dp.length) : url);
            if (isLocal && path.startsWith('/storage/')) {
                return 'https://mertmeric.music' + path;
            }
            return path;
        }

        function captureDraftAnswers() {
            const form = document.getElementById('eduApplyForm');
            if (!form) return;
            const qs = EDU_STATE.config.questions || [];
            qs.forEach((q, idx) => {
                const key = q.id || ('q_' + idx);
                if (q.type === 'select') {
                    const checked = form.querySelector(`input[name="f_${idx}"]:checked`);
                    if (checked) EDU_STATE.draftAnswers[key] = checked.value;
                } else {
                    const inp = form.querySelector(`[name="f_${idx}"]`);
                    if (inp) EDU_STATE.draftAnswers[key] = inp.value;
                }
            });
        }

        function renderEduPage() {
            const isEn = EDU_STATE.lang === 'en';
            const cfg = EDU_STATE.config;

            const backBtn = document.getElementById('eduBackBtn');
            if (backBtn) backBtn.textContent = isEn ? EDU_STATE.backEn : EDU_STATE.backTr;

            const badge = document.getElementById('eduBadge');
            if (badge) badge.textContent = isEn ? (cfg.badge_en || 'DJ ACADEMY') : (cfg.badge_tr || 'DJ ACADEMY');

            document.querySelectorAll('#eduPageLangSwitch .lang-flag-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === EDU_STATE.lang);
            });

            const titleEl = document.getElementById('eduPageTitle');
            if (titleEl) {
                titleEl.textContent = isEn
                    ? (cfg.title_en || cfg.title_tr || 'DJ Academy Application')
                    : (cfg.title_tr || 'DJ & Prodüksiyon Eğitimi Başvuru Formu');
            }

            const mainArea = document.getElementById('eduMainArea');
            if (!mainArea) return;

            if (EDU_STATE.submitted) {
                const sTitle = isEn ? 'Application Received ✓' : 'Başvurunuz Alındı ✓';
                const sDesc = isEn
                    ? 'Your application has been submitted successfully. We will contact you shortly.'
                    : 'Başvurunuz başarıyla kaydedildi. En kısa sürede sizinle iletişime geçeceğiz.';
                const backHome = isEn ? '‹ Back to Home' : '‹ Ana Sayfaya Dön';
                mainArea.innerHTML = `
                    <div class="edu-success-box">
                        <h3>${esc(sTitle)}</h3>
                        <p>${esc(sDesc)}</p>
                        <div style="margin-top:18px">
                            <a href="index.html#hub" class="bio-back-btn" style="display:inline-flex">${esc(backHome)}</a>
                        </div>
                    </div>
                `;
                return;
            }

            const descEl = document.getElementById('eduPageDesc');
            if (descEl) {
                descEl.textContent = isEn
                    ? (cfg.desc_en || cfg.desc_tr || '')
                    : (cfg.desc_tr || '');
            }

            const form = document.getElementById('eduApplyForm');
            if (!form) return;

            const qs = Array.isArray(cfg.questions) ? cfg.questions : [];
            form.innerHTML = qs.map((q, idx) => {
                const key = q.id || ('q_' + idx);
                const savedVal = EDU_STATE.draftAnswers[key] || '';
                const label = isEn ? (q.label_en || q.label_tr) : (q.label_tr || q.label_en);
                const ph = isEn ? (q.placeholder_en || q.placeholder_tr || '') : (q.placeholder_tr || '');
                const reqMark = q.required ? `<span class="edu-req">*</span>` : '';

                let inputHtml = '';
                if (q.type === 'textarea') {
                    inputHtml = `<textarea class="edu-inp" name="f_${idx}" rows="3" placeholder="${esc(ph)}" ${q.required ? 'required' : ''}>${esc(savedVal)}</textarea>`;
                } else if (q.type === 'select') {
                    const rawOpts = isEn ? (q.options_en || q.options_tr || '') : (q.options_tr || '');
                    const opts = rawOpts.split(',').map(s => s.trim()).filter(Boolean);
                    if (opts.length) {
                        inputHtml = `
                            <div class="edu-options-grid">
                                ${opts.map((opt, oIdx) => `
                                    <label class="edu-opt-pill">
                                        <input type="radio" name="f_${idx}" value="${esc(opt)}" ${savedVal === opt || (!savedVal && oIdx === 0 && q.required) ? 'checked' : ''} ${q.required ? 'required' : ''}>
                                        <span>${esc(opt)}</span>
                                    </label>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        inputHtml = `<input type="text" class="edu-inp" name="f_${idx}" value="${esc(savedVal)}" placeholder="${esc(ph)}" ${q.required ? 'required' : ''}>`;
                    }
                } else {
                    const inpType = ['tel', 'email'].includes(q.type) ? q.type : 'text';
                    inputHtml = `<input type="${inpType}" class="edu-inp" name="f_${idx}" value="${esc(savedVal)}" placeholder="${esc(ph)}" ${q.required ? 'required' : ''}>`;
                }

                return `
                    <div class="edu-field">
                        <label class="edu-label">${esc(label)} ${reqMark}</label>
                        ${inputHtml}
                    </div>
                `;
            }).join('') + `
                <button type="submit" class="edu-submit-btn" id="eduSubmitBtn">
                    ${esc(isEn ? (cfg.submit_en || 'Submit Application ↗') : (cfg.submit_tr || 'Başvuruyu Gönder ↗'))}
                </button>
            `;
        }

        document.querySelectorAll('#eduPageLangSwitch .lang-flag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                captureDraftAnswers();
                EDU_STATE.lang = btn.dataset.lang === 'en' ? 'en' : 'tr';
                try { localStorage.setItem('site_lang', EDU_STATE.lang); } catch (_) { }
                renderEduPage();
            });
        });

        let activeBioBg = '';
        const bioBgBlobCache = new Map();

        function applyEduSettings(d) {
            if (!d || typeof d !== 'object') return;
            if (d.logo_image) {
                const logoImg = document.getElementById('bioLogoImg');
                const proxiedLogo = getProxiedMediaUrl(d.logo_image);
                if (logoImg.getAttribute('src') !== proxiedLogo) logoImg.src = proxiedLogo;
                logoImg.style.display = 'block';
                document.getElementById('bioLogoText').style.display = 'none';
            } else if (d.name) {
                const logoTxt = document.getElementById('bioLogoText');
                logoTxt.textContent = d.name;
                logoTxt.style.display = 'block';
            }

            const cloudBg = getProxiedMediaUrl(d.bg_gif || d.bg_video || '');
            if (cloudBg) {
                const isVid = /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(cloudBg);
                if (isVid) {
                    const v = document.getElementById('bioBgv');
                    v.style.display = 'block';
                    if (activeBioBg !== cloudBg) {
                        activeBioBg = cloudBg;
                        const cachedBlob = bioBgBlobCache.get(cloudBg);
                        if (cachedBlob) {
                            v.src = cachedBlob;
                            v.play().catch(() => { });
                        } else {
                            fetch(cloudBg)
                                .then(r => {
                                    if (!r.ok) throw new Error('status ' + r.status);
                                    return r.blob();
                                })
                                .then(blob => {
                                    const blobUrl = URL.createObjectURL(blob);
                                    bioBgBlobCache.set(cloudBg, blobUrl);
                                    if (activeBioBg === cloudBg) {
                                        v.src = blobUrl;
                                        v.play().catch(() => { });
                                    }
                                })
                                .catch(() => {
                                    if (activeBioBg === cloudBg) {
                                        if (v.getAttribute('src') !== cloudBg) v.src = cloudBg;
                                        v.play().catch(() => { });
                                    }
                                });
                        }
                    }
                } else {
                    activeBioBg = cloudBg;
                    const g = document.getElementById('bggif');
                    if (g.getAttribute('src') !== cloudBg) g.src = cloudBg;
                    g.style.display = 'block';
                }
            }

            if (d.brand) {
                const bn = document.getElementById('bn');
                if (bn) bn.textContent = d.brand;
            }
            if (d.bio_back_text) EDU_STATE.backTr = d.bio_back_text;
            if (d.bio_footer_label) {
                const footLbl = document.getElementById('bioFooterLbl');
                if (footLbl) footLbl.textContent = d.bio_footer_label;
            }
            if (d.email) {
                const mailEl = document.getElementById('bioFooterMail');
                if (mailEl) {
                    mailEl.textContent = d.email;
                    mailEl.href = 'mailto:' + d.email;
                }
            }
            if (d.instagram_url) document.getElementById('bioLinkIg').href = d.instagram_url;
            if (d.soundcloud_url) document.getElementById('bioLinkSc').href = d.soundcloud_url;
            if (d.spotify_url) document.getElementById('bioLinkSp').href = d.spotify_url;
            if (d.youtube_url) document.getElementById('bioLinkYt').href = d.youtube_url;

            if (d.dock_icons && d.dock_icons._edu_config && typeof d.dock_icons._edu_config === 'object') {
                const ec = d.dock_icons._edu_config;
                EDU_STATE.config = {
                    ...EDU_STATE.config,
                    ...ec,
                    questions: Array.isArray(ec.questions) ? ec.questions : EDU_STATE.config.questions
                };
            }
            captureDraftAnswers();
            renderEduPage();
        }

        renderEduPage();

        try {
            const cached = JSON.parse(localStorage.getItem('mert_cloud_settings_v2') || 'null');
            if (cached) applyEduSettings(cached);
        } catch (_) { }

        (async function () {
            try {
                const res = await fetch(SB_URL + "/rest/v1/site_settings?id=eq.1&select=*", {
                    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }
                });
                if (!res.ok) return;
                const rows = await res.json();
                const data = Array.isArray(rows) ? rows[0] : null;
                if (!data) return;
                applyEduSettings(data);
                try {
                    localStorage.setItem('mert_cloud_settings_v2', JSON.stringify(data));
                } catch (_) { }
            } catch (_) { }
        })();

        document.addEventListener('submit', async e => {
            if (e.target && e.target.id === 'eduApplyForm') {
                e.preventDefault();
                const form = e.target;
                const btn = document.getElementById('eduSubmitBtn');
                const errEl = document.getElementById('eduFormErr');
                if (errEl) errEl.style.display = 'none';

                const qs = Array.isArray(EDU_STATE.config.questions) ? EDU_STATE.config.questions : [];
                const answers = qs.map((q, idx) => {
                    let val = '';
                    if (q.type === 'select' && form.querySelector(`input[type="radio"][name="f_${idx}"]`)) {
                        const checked = form.querySelector(`input[name="f_${idx}"]:checked`);
                        val = checked ? checked.value.trim() : '';
                    } else {
                        const inp = form.querySelector(`[name="f_${idx}"]`);
                        val = inp ? inp.value.trim() : '';
                    }
                    return {
                        question_id: q.id || ('q_' + idx),
                        question: q.label_tr || q.label_en || ('Soru ' + (idx + 1)),
                        answer: val
                    };
                });

                if (btn) {
                    btn.disabled = true;
                    btn.textContent = EDU_STATE.lang === 'en' ? 'Submitting...' : 'Gönderiliyor...';
                }

                try {
                    const res = await fetch(SB_URL + "/rest/v1/edu_submissions", {
                        method: "POST",
                        headers: {
                            apikey: SB_KEY,
                            Authorization: "Bearer " + SB_KEY,
                            "Content-Type": "application/json",
                            Prefer: "return=minimal"
                        },
                        body: JSON.stringify({
                            answers,
                            is_read: false
                        })
                    });

                    if (!res.ok) {
                        const errTxt = await res.text();
                        throw new Error(errTxt || ('HTTP ' + res.status));
                    }

                    EDU_STATE.submitted = true;
                    renderEduPage();
                } catch (err) {
                    if (errEl) {
                        errEl.textContent = EDU_STATE.lang === 'en'
                            ? 'Could not submit application. Please try again or contact via Instagram/Email.'
                            : 'Başvuru gönderilirken bir hata oluştu. Lütfen tekrar deneyin veya Instagram/E-posta üzerinden ulaşın.';
                        errEl.style.display = 'block';
                    }
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = EDU_STATE.lang === 'en'
                            ? (EDU_STATE.config.submit_en || 'Submit Application ↗')
                            : (EDU_STATE.config.submit_tr || 'Başvuruyu Gönder ↗');
                    }
                }
            }
        });
    </script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
